<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro e Consistência de Notas</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5">
        <h2 class="mb-4 text-center">Portal de Cadastro de Notas</h2>

        <!-- Formulário de Cadastro -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Dados do Aluno</h5>
            </div>
            <div class="card-body">
                <form id="formNota" class="row g-3 needs-validation" novalidate>
                    <div class="col-md-6">
                        <label for="nomeAluno" class="form-label">Nome do Aluno</label>
                        <input type="text" class="form-control" id="nomeAluno" required>
                        <div class="invalid-feedback">Por favor, informe o nome do aluno.</div>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="disciplina" class="form-label">Disciplina</label>
                        <input type="text" class="form-control" id="disciplina" required>
                        <div class="invalid-feedback">Por favor, informe a disciplina.</div>
                    </div>

                    <div class="col-md-4">
                        <label for="nota1" class="form-label">Nota 1 (0 a 10)</label>
                        <input type="number" step="0.1" min="0" max="10" class="form-control" id="nota1" required>
                        <div class="invalid-feedback">Informe uma nota válida entre 0 e 10.</div>
                    </div>

                    <div class="col-md-4">
                        <label for="nota2" class="form-label">Nota 2 (0 a 10)</label>
                        <input type="number" step="0.1" min="0" max="10" class="form-control" id="nota2" required>
                        <div class="invalid-feedback">Informe uma nota válida entre 0 e 10.</div>
                    </div>

                    <div class="col-md-4">
                        <label for="nota3" class="form-label">Nota 3 (0 a 10)</label>
                        <input type="number" step="0.1" min="0" max="10" class="form-control" id="nota3" required>
                        <div class="invalid-feedback">Informe uma nota válida entre 0 e 10.</div>
                    </div>

                    <div class="col-12 text-end">
                        <button type="submit" class="btn btn-success px-4">Salvar Nota</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabela de Registros -->
        <div class="card shadow-sm">
            <div class="card-header bg-secondary text-white">
                <h5 class="mb-0">Alunos Cadastrados</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle" id="tabelaAlunos">
                        <thead>
                            <tr>
                                <th>Aluno</th>
                                <th>Disciplina</th>
                                <th>N1</th>
                                <th>N2</th>
                                <th>N3</th>
                                <th>Média</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Os dados inseridos aparecerão dinamicamente aqui -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Arquivo JavaScript Externo -->
    <script src="script2.js"></script>
</body>
</html>
