<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 06: Cronômetro Progressivo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm text-center">
                    <div class="card-header bg-dark text-white">
                        <h4 class="mb-0">Exemplo 06: Cronômetro / Temporizador</h4>
                    </div>
                    <div class="card-body p-5">
                        <!-- Display do Tempo -->
                        <div class="display-1 fw-bold font-monospace text-primary mb-4" id="displayTempo">
                            00:00:00
                        </div>

                        <!-- Botões de Controle -->
                        <div class="d-flex justify-content-center gap-2">
                            <button id="btnIniciar" class="btn btn-success px-4 fw-semibold">Iniciar</button>
                            <button id="btnPausar" class="btn btn-warning px-4 fw-semibold" disabled>Pausar</button>
                            <button id="btnZerar" class="btn btn-outline-danger px-4 fw-semibold">Zerar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
