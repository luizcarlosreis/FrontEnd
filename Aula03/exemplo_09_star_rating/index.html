<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 09: Sistema de Avaliação por Estrelas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm text-center">
                    <div class="card-header bg-warning text-dark">
                        <h4 class="mb-0">Exemplo 09: Avaliação por Estrelas (Star Rating)</h4>
                    </div>
                    <div class="card-body p-5">
                        <p class="text-muted mb-3">Como você avalia nossa aula de hoje?</p>
                        
                        <!-- Container das Estrelas -->
                        <div class="stars mb-4" id="starsContainer">
                            <span class="star" data-value="1">★</span>
                            <span class="star" data-value="2">★</span>
                            <span class="star" data-value="3">★</span>
                            <span class="star" data-value="4">★</span>
                            <span class="star" data-value="5">★</span>
                        </div>

                        <!-- Feedback textual -->
                        <p id="feedbackTexto" class="fs-5 fw-semibold text-secondary mb-4">Clique em uma estrela para avaliar</p>
                        
                        <button id="btnEnviar" class="btn btn-warning px-4 fw-semibold d-none">Enviar Avaliação</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
