<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 14: Lista de Tarefas com LocalStorage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                        <h4 class="mb-0">Exemplo 14: To-Do List com LocalStorage</h4>
                        <span id="badgeContador" class="badge bg-light text-dark">0 tarefas</span>
                    </div>
                    <div class="card-body p-4">
                        <!-- Formulário de Adição -->
                        <form id="formTarefa" class="mb-4">
                            <div class="input-group">
                                <input type="text" class="form-control" id="inputTarefa" placeholder="Digite uma nova tarefa..." required>
                                <button class="btn btn-primary" type="submit">Adicionar</button>
                            </div>
                        </form>

                        <!-- Ações em lote -->
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="mb-0 text-secondary fs-6 fw-bold">Tarefas Salvas no Navegador</h5>
                            <button id="btnLimpar" class="btn btn-outline-danger btn-sm">Limpar Tudo</button>
                        </div>

                        <!-- Lista de Tarefas -->
                        <ul id="listaTarefas" class="list-group">
                            <!-- Inserido dinamicamente via JS -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
