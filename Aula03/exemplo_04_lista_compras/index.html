<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 04: Lista de Compras Dinâmica (CRUD Simples)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-info text-white">
                        <h4 class="mb-0">Exemplo 04: Lista de Compras Dinâmica</h4>
                    </div>
                    <div class="card-body p-4">
                        <form id="formItem" class="mb-4">
                            <div class="input-group">
                                <input type="text" class="form-control" id="inputItem" placeholder="Digite o nome do produto..." required>
                                <button class="btn btn-info text-white" type="submit">Adicionar</button>
                            </div>
                        </form>

                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="mb-0 text-secondary">Itens na Lista</h5>
                            <span id="contadorItens" class="badge bg-secondary">0 itens</span>
                        </div>

                        <ul id="listaCompras" class="list-group">
                            <li class="list-group-item text-center text-muted py-3">Sua lista está vazia.</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
