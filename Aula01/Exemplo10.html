<!DOCTYPE html>
<html lang="pt-BR">
<head><title>Canvas e Iframe</title></head>
<body>
    <h2>Área de Desenho (Canvas)</h2>
    <!-- O Canvas precisa do JavaScript para desenhar algo dentro dele -->
    <canvas id="meuCanvas" width="300" height="150" style="border:1px solid #000;"></canvas>

    <h2>Incorporando o Wikipédia via Iframe</h2>
    <!-- Exibindo outro site dentro de uma "janela" na sua página -->
    <iframe src="https://pt.wikipedia.org" width="100%" height="400" frameborder="0"></iframe>
</body>
</html>
