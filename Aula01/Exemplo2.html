<!DOCTYPE html>
<html lang="pt-BR">
<head><title>Listas em HTML</title></head>
<body>
    <h2>Lista de Compras (Não Ordenada)</h2>
    <ul>
        <li>Maçã</li>
        <li>Pão</li>
        <li>Leite</li>
    </ul>

    <h2>Passo a Passo (Ordenada)</h2>
    <ol>
        <li>Abra o navegador.</li>
        <li>Digite o endereço web.</li>
        <li>Pressione Enter.</li>
		<li>x</li>
        <li>y</li>
        <li>z</li>
    </ol>
</body>
</html>
