<!DOCTYPE html>
<html lang="pt-BR">
<head><title>Gráficos SVG</title></head>
<body>
    <h2>Formas Nativas com SVG</h2>
    <svg width="200" height="200" style="background-color: #f0f0f0;">
        <!-- Desenhando um círculo vermelho -->
        <circle cx="100" cy="100" r="50" fill="red" />
        
        <!-- Desenhando um quadrado com borda azul -->
        <rect x="20" y="20" width="50" height="50" fill="yellow" stroke="blue" stroke-width="3" />
    </svg>
</body>
</html>
