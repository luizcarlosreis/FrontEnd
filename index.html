<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 01: Validação de Senha em Tempo Real</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Exemplo 01: Validação de Senha em Tempo Real</h4>
                    </div>
                    <div class="card-body p-4">
                        <form>
                            <div class="mb-3">
                                <label for="senhaInput" class="form-label fw-bold">Digite sua Senha:</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="senhaInput" placeholder="Mínimo 8 caracteres, números e símbolos">
                                    <button class="btn btn-outline-secondary" type="button" id="toggleSenha">👁️</button>
                                </div>
                            </div>
                            
                            <!-- Indicador de Força -->
                            <div class="mb-3">
                                <div class="progress" style="height: 8px;">
                                    <div id="barraForca" class="progress-bar" role="progressbar" style="width: 0%;"></div>
                                </div>
                                <small id="textoForca" class="text-muted mt-1 d-block">Força da senha: <strong>Aguardando entrada...</strong></small>
                            </div>

                            <!-- Critérios de validação -->
                            <ul class="list-group list-group-flush small">
                               <li id="reqTamanho" class="list-group-item text-muted">❌ Pelo menos 8 caracteres</li>
                               <li id="reqNumero" class="list-group-item text-muted">❌ Pelo menos um número (0-9)</li>
                               <li id="reqEspecial" class="list-group-item text-muted">❌ Pelo menos um caractere especial (!@#$%^&*)</li>
                            </ul>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
